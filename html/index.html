<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>DTlib</title>
</head>
<body>
    <div id="notifications"></div>
    <div id="textui" class="hidden">
        <div class="textui-head">
            <span id="textui-icon" class="textui-icon hidden"></span>
            <div class="textui-copy">
                <div id="textui-title" class="textui-title hidden"></div>
                <div id="textui-text" class="textui-description hidden"></div>
            </div>
        </div>
        <div id="textui-options" class="textui-options hidden"></div>
    </div>
    <div id="progress" class="hidden"><div class="progress-label" id="progress-label"></div><div class="progress-track"><div id="progress-fill"></div></div></div>
    <div id="modal" class="hidden">
        <div id="menu" class="panel hidden"><div class="panel-head"><div><div class="eyebrow">DT ECOSYSTEM</div><h1 id="menu-title"></h1><p id="menu-subtitle"></p></div><button class="close" id="menu-close">×</button></div><div id="menu-items"></div></div>
        <form id="input" class="panel hidden"><div class="panel-head"><div><div class="eyebrow">DT ECOSYSTEM</div><h1 id="input-title"></h1><p id="input-description"></p></div><button type="button" class="close" id="input-close">×</button></div><div id="input-fields"></div><div class="input-actions"><button type="button" id="input-cancel">CANCEL</button><button type="submit" class="primary">CONFIRM</button></div></form>
    </div>
    <iframe id="ecosystem-dialogue" title="Dialogue" src="dialogue/dist/index.html" style="position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:transparent;z-index:90"></iframe>
    <script src="notify.js"></script>
    <script src="app.js"></script>
    <script src="ecosystem.js"></script>
</body>
</html>
