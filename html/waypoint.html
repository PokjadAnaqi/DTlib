<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="waypoint.css">
    <title>DT Waypoint</title>
</head>
<body>
    <main id="waypoint" class="waypoint objective">
        <div class="scanline"></div>
        <section class="nav-card">
            <div class="topline">
                <span class="system-tag">DT // NAV</span>
                <span class="signal-dot"></span>
            </div>
            <div class="content-row">
                <div id="icon-shell" class="icon-shell">
                    <i id="icon" class="fa-solid fa-location-dot"></i>
                    <img id="image" alt="" />
                </div>
                <div class="copy">
                    <span id="subtitle" class="subtitle">DT NAVIGATION</span>
                    <strong id="label">OBJECTIVE</strong>
                </div>
                <div id="distance-wrap" class="distance-wrap">
                    <span id="distance">0</span><small>M</small>
                </div>
            </div>
            <div class="bar"><span></span></div>
        </section>
        <div class="locator">
            <span class="locator-line"></span>
            <span class="locator-diamond"></span>
            <span class="locator-point"></span>
        </div>
    </main>
    <script src="waypoint.js"></script>
</body>
</html>
